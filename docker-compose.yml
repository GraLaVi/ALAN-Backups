services:
  backup:
    build:
      context: .
    container_name: alan_backup_service
    restart: unless-stopped

    # Cap at 1.5 cores so the nightly compression (gzip/tar/pg_dump client)
    # can never starve the containers sharing this host (grafana, celery beat,
    # rabbitmq). This is a starvation guard, NOT an alert fix: the
    # ContainerHighCpu alert measures CPU normalized by host cores (see
    # ALAN-Loki prometheus/rules/containers.yml), so 1.5 cores registers well
    # under its 80%-of-host threshold on any host with >= 2 cores. Backups run
    # sequentially (one gzip + its producer), so 1.5 matches the real peak.
    cpus: 1.5

    volumes:
      # Backup storage location
      - /mnt/shared/alan/backups:/backups

      # Cold-storage archive: old backups are moved here (cheaper/slower disk
      # will be mounted at /mnt/shared/object_storage). rslave propagation so
      # the container sees the disk if it is mounted on the host after
      # container start (default rprivate would keep showing the old dir).
      - type: bind
        source: /mnt/shared/object_storage/backup_archives
        target: /backup_archives
        bind:
          propagation: rslave

      # Local temporary storage for large backups (used when BACKUP_ROOT is on s3fs)
      # Files are written here first, then copied to S3 and deleted
      - /tmp/alan-backups:/tmp/backups

      # Access to volumes we need to backup
      - rabbitmq_data:/source/rabbitmq_data:ro
      - rabbitmq_logs:/source/rabbitmq_logs:ro
      - loki-data:/source/loki-data:ro
      - grafana-data:/source/grafana-data:ro

      # Backup scripts (removed :ro so chmod can work)
      - ./scripts/backup.sh:/usr/local/bin/backup.sh
      - ./scripts/notify.sh:/usr/local/bin/notify.sh

      # Status files for API integration (will be created by backup script)
      - /mnt/shared/alan/services:/services

      # Docker socket (no longer used for PostgreSQL, but kept for potential future use)
      - /var/run/docker.sock:/var/run/docker.sock

    networks:
      - alan_network

    environment:
      # Backup configuration
      - BACKUP_SCHEDULE=0 3 * * *  # 3 AM PST/PDT daily
      - KEEP_DAILY=1               # newest N dailies kept in primary per backup set
      - KEEP_WEEKLY=2              # newest N weeklies kept in primary per backup set
      - ARCHIVE_ROOT=/backup_archives
      - ARCHIVE_RETENTION_DAYS=180 # purge archived backups after 6 months
      # ARCHIVE_REMOTE (unset in dev) switches archival from filesystem copies
      # into ARCHIVE_ROOT to direct rclone uploads (bucket/prefix); set in
      # docker-compose.prod.yml where the archive is a DO Spaces bucket.
      - TZ=America/New_York

      # Environment and notification configuration
      - APP_ENV=${APP_ENV:-development}
      # - NOTIFICATION_EMAIL=${NOTIFICATION_EMAIL:-admin@gphusa.com}

      # RabbitMQ API access for definitions backup
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=15672
      - RABBITMQ_USER=${RABBITMQ_DEFAULT_USER:-guest}
      - RABBITMQ_PASS=${RABBITMQ_DEFAULT_PASS:-guest}

      # PostgreSQL connection for backups
      - POSTGRES_HOST=161.97.145.138
      - POSTGRES_USER=${POSTGRES_USER:-pgbkup}
      - POSTGRES_PASS=${POSTGRES_PASSWORD:-wjJf6aYvbw8CMGc0j}
      - POSTGRES_DB=${POSTGRES_DB:-alandb}

    # Setup and run cron (packages are pre-installed in Dockerfile)
    entrypoint: |
      sh -c "
        # Check and create required directories with proper permissions
        mkdir -p /var/spool/cron/crontabs && \
        chmod 755 /var/spool/cron/crontabs && \
        mkdir -p /home/david/logs && \
        chmod 755 /home/david/logs && \
        mkdir -p /backups/rabbitmq/daily /backups/rabbitmq/weekly /backups/loki/daily /backups/loki/weekly /backups/grafana/daily /backups/grafana/weekly /backups/postgresql/daily /backups/postgresql/weekly && \
        mkdir -p /services/health_checks/status && \
        mkdir -p /tmp/backups && \
        # Check write permissions on critical directories
        (touch /backups/.write_test 2>/dev/null && rm -f /backups/.write_test && echo '✓ /backups is writable') || echo 'WARNING: /backups may not be writable by UID 1000' && \
        (touch /tmp/backups/.write_test 2>/dev/null && rm -f /tmp/backups/.write_test && echo '✓ /tmp/backups is writable') || echo 'WARNING: /tmp/backups may not be writable by UID 1000' && \
        (touch /services/.write_test 2>/dev/null && rm -f /services/.write_test && echo '✓ /services is writable') || echo 'WARNING: /services may not be writable by UID 1000' && \
        (touch /backup_archives/.write_test 2>/dev/null && rm -f /backup_archives/.write_test && echo '✓ /backup_archives is writable') || echo 'WARNING: /backup_archives not writable — archival will be skipped' && \
        # Ensure scripts are executable
        chmod +x /usr/local/bin/backup.sh /usr/local/bin/notify.sh && \
        # Write cron job to user crontab
        echo \"$$BACKUP_SCHEDULE nice -n 19 ionice -c3 /usr/local/bin/backup.sh >> /home/david/logs/backup.log 2>&1\" > /var/spool/cron/crontabs/david && \
        chmod 600 /var/spool/cron/crontabs/david && \
        echo \"Backup service started. Schedule: $$BACKUP_SCHEDULE (no initial backup on restart)\" && \
        echo \"Running as user: \$(id -un) (UID: \$(id -u), GID: \$(id -g))\" && \
        crond -f -d 8 -c /var/spool/cron/crontabs
      "

volumes:
  # External volumes from other services
  rabbitmq_data:
    external: true
    name: alan-broker_rabbitmq_data
  rabbitmq_logs:
    external: true
    name: alan-broker_rabbitmq_logs
  loki-data:
    external: true
    name: alan-loki_loki-data
  grafana-data:
    external: true
    name: alan-loki_grafana-data

networks:
  alan_network:
    external: true
